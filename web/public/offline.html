<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Sem conexão — Lumera</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0a0a0b; color: #e8e8f0; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg,#7b2eff,#4a6cff); font-size: 36px; font-weight: 800; }
      h1 { margin: 0 0 12px; font-size: 1.75rem; }
      p { color: #9b95a8; line-height: 1.6; }
      button { margin-top: 12px; border: 0; border-radius: 10px; padding: 12px 18px; color: white; font: inherit; font-weight: 700; background: linear-gradient(135deg,#7b2eff,#4a6cff); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">L</div>
      <h1>Você está sem conexão</h1>
      <p>Confira sua internet e tente novamente. As informações da sua conta e os pagamentos precisam de conexão.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
