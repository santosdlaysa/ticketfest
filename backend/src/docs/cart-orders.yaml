paths:
  /api/cart:
    get:
      tags:
        - Cart
      summary: Obter carrinho
      description: Retorna o carrinho atual (por sessao ou usuario autenticado)
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Carrinho atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

    post:
      tags:
        - Cart
      summary: Adicionar ao carrinho
      description: Adiciona ingresso ao carrinho
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '200':
          description: Item adicionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Ingresso indisponivel ou quantidade invalida

    delete:
      tags:
        - Cart
      summary: Limpar carrinho
      description: Remove todos os itens do carrinho
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Carrinho limpo

  /api/cart/{itemId}:
    put:
      tags:
        - Cart
      summary: Atualizar quantidade
      description: Atualiza quantidade de um item no carrinho
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Quantidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

    delete:
      tags:
        - Cart
      summary: Remover item
      description: Remove item do carrinho
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item removido

  /api/orders:
    get:
      tags:
        - Orders
      summary: Listar pedidos do usuario
      description: Retorna todos os pedidos do usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Orders
      summary: Criar pedido
      description: Cria novo pedido a partir do carrinho
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  payment:
                    type: object
                    description: Dados do pagamento (PIX QR code, etc)
        '400':
          description: Carrinho vazio ou ingressos indisponiveis
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Obter pedido
      description: Retorna detalhes de um pedido especifico
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/orders/{orderId}/cancel:
    post:
      tags:
        - Orders
      summary: Cancelar pedido
      description: Cancela um pedido pendente
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedido cancelado
        '400':
          description: Pedido nao pode ser cancelado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
